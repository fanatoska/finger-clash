name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          python3 scripts/prepare-android.py
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk finger-clash-debug.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FingerClash-Debug-APK
          path: finger-clash-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-apk
          name: "Finger Clash v1.0 (APK)"
          body: |
            🎮 **Finger Clash - Настоящий бой на двоих на одном экране!**

            - 📱 Скачайте файл **`finger-clash-debug.apk`** ниже на свой Android-смартфон и нажмите «Установить».
            - ⚡ Собрано автоматически с помощью Capacitor и GitHub Actions CI/CD.
            - 🎯 Поддерживает 10 мини-игр, оффлайн-режим, вибрации и 60 FPS.
          draft: false
          prerelease: false
          files: finger-clash-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
